# E-Library 共用执行设定。敏感资讯与环境差异透过环境变数覆写。
spring:
  application:
    name: e-library-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/elibrary?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:elibrary}
    password: ${DB_PASSWORD:elibrary}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:40}
      connection-timeout: 2000
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

mybatis:
  mapper-locations: classpath*:/mybatis/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  role: ${APP_ROLE:all}
  auth:
    dev-mode: ${DEV_AUTH_ENABLED:true}
    default-user-id: ${DEV_USER_ID:10001}
    default-role: ${DEV_USER_ROLE:USER}
  lending:
    max-active-loans: ${MAX_ACTIVE_LOANS:5}
    loan-days: ${LOAN_DAYS:14}
    policy-version: ${LOAN_POLICY_VERSION:v1}
    expiry-interval: 30s
    expiry-batch: 500
  outbox:
    batch-size: 200
    lease: 30s
    direct-threads: ${OUTBOX_DIRECT_THREADS:2}
    direct-queue-capacity: ${OUTBOX_DIRECT_QUEUE_CAPACITY:500}
    rocketmq-enabled: ${ROCKETMQ_ENABLED:false}
    endpoints: ${ROCKETMQ_ENDPOINTS:localhost:8081}
# XXL-JOB 仅扫描直发遗漏或重试到期的 Outbox 事件；本机预设不连接调度中心。
xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
      access-token: ${XXL_JOB_ACCESS_TOKEN:}
      timeout-seconds: ${XXL_JOB_ADMIN_TIMEOUT_SECONDS:3}
    executor:
      app-name: ${XXL_JOB_EXECUTOR_APP_NAME:e-library-outbox}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      log-path: ${XXL_JOB_LOG_PATH:./logs/xxl-job}
      log-retention-days: ${XXL_JOB_LOG_RETENTION_DAYS:30}

server:
  shutdown: graceful
  error:
    include-message: never
