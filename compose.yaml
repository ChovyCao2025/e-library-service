name: e-library-service
services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: elibrary
      MYSQL_USER: elibrary
      MYSQL_PASSWORD: elibrary
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  rocketmq-nameserver:
    profiles: ["mq"]
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  rocketmq-broker:
    profiles: ["mq"]
    image: apache/rocketmq:5.3.2
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    command: sh mqbroker --enable-proxy
    depends_on:
      rocketmq-nameserver:
        condition: service_started
    ports:
      - "10909:10909"
      - "10911:10911"
      - "8081:8081"

volumes:
  mysql-data:
